# Lints and builds Betaflight Lua Scripts.
#
# After building, artifacts are kept for 7 days.

name: CI

on: 
  workflow_call:
    inputs:
      release_build:
        description: 'Specifies if it is a debug build or a release build'
        default: false
        required: false
        type: boolean

jobs:
  check:
    name: Lint and Typecheck
    runs-on: ubuntu-24.04
    steps:
      - name: Code Checkout
        uses: actions/checkout@v4
        with:
          submodules: true

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: ~/.cargo
          key: cargo-stylua-${{ runner.os }}

      - name: Install tools
        run: make install-tools

      - name: Run checks
        run: make check

  build:
    name: Build
    runs-on:  ubuntu-22.04
    steps:
      - name: Code Checkout
        uses: actions/checkout@v4

      - name: Install Lua
        run: sudo apt-get -y install lua5.2

      - name: Install Zip
        run: sudo apt-get -y install zip

      - name: Execute Build
        run: make release

      - name: Publish build artifacts
        uses: actions/upload-artifact@v4.3.0
        with:
          name: Assets
          path: ./release/*.zip
          retention-days: 7
